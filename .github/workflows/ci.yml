name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install libchdb
        # chdb-go's init() dlopens libchdb.so and panics if it's missing, so the
        # block/web packages can't even be imported under `go test` without it.
        run: |
          curl -sL https://lib.chdb.io | bash
          sudo ldconfig
      - name: Run tests
        run: go test -short ./...
